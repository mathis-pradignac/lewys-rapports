[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # Autorise l'affichage intégré (iframe) uniquement dans l'application elle-même et dans le Lewys Hub
    Content-Security-Policy = "frame-ancestors 'self' https://lewys-hub-officiel.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
